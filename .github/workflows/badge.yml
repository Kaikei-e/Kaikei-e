name: Profile metrics

on:
  schedule:
    # 09:17 JST（00:17 UTC）。毎時0分は高負荷帯で遅延・ドロップしやすいのでずらす
    - cron: "17 0 * * *"
  workflow_dispatch:

# 既定権限はゼロ。必要な権限はジョブ単位でだけ与える
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # サードパーティのコードはここでだけ動かす（読み取り専用・PATなし）
  generate:
    name: Generate assets (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Checkout renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/profile-cards

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # package.json の packageManager を唯一の正とし、tarball の sha512 を照合してから入れる
      - name: Install pinned pnpm
        working-directory: .github/profile-cards
        run: |
          set -euo pipefail
          pm="$(jq -r '.packageManager' package.json)"
          if [[ ! "$pm" =~ ^pnpm@([0-9]+\.[0-9]+\.[0-9]+)\+sha512\.([0-9a-f]{128})$ ]]; then
            echo "::error::packageManager must pin both version and sha512"
            exit 1
          fi
          ver="${BASH_REMATCH[1]}"
          hash="${BASH_REMATCH[2]}"
          cd "$RUNNER_TEMP"
          npm pack "pnpm@${ver}" --silent >/dev/null
          echo "${hash}  pnpm-${ver}.tgz" | sha512sum --check --strict
          npm install --global --ignore-scripts "./pnpm-${ver}.tgz"
          pnpm --version

      - name: Install renderer dependencies
        working-directory: .github/profile-cards
        run: pnpm install --frozen-lockfile --prod

      - name: Render stats cards
        working-directory: .github/profile-cards
        env:
          PAT_1: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: node render.mjs "$GITHUB_WORKSPACE/profile"

      # サードパーティ製アクションを使わず gh + jq だけで生成する
      - name: Recent activity
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          ACTIVITY_DAYS: "14"
          ACTIVITY_LIMIT: "5"
        run: |
          set -euo pipefail
          mkdir -p profile
          since="$(date -u -d "${ACTIVITY_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)"

          filter="$(cat <<'JQ'
          def clean: tostring | gsub("[^a-z_]"; "");
          def num:
            [.payload.number, .payload.pull_request.number, .payload.issue.number]
            | map(select(type == "number")) | .[0];
          def describe:
            if   .type == "PushEvent"              then "Pushed to"
            elif .type == "PullRequestEvent"       then "PR \(.payload.action // "" | clean) in"
            elif .type == "PullRequestReviewEvent" then "Reviewed a PR in"
            elif .type == "IssuesEvent"            then "Issue \(.payload.action // "" | clean) in"
            elif .type == "IssueCommentEvent"      then "Commented in"
            elif .type == "ReleaseEvent"           then "Released in"
            elif .type == "CreateEvent"            then "Created \(.payload.ref_type // "" | clean) in"
            elif .type == "PublicEvent"            then "Open-sourced"
            elif .type == "WatchEvent"             then "Starred"
            elif .type == "ForkEvent"              then "Forked"
            else empty end;
          [ .[]
            | select(.created_at >= $since)
            # Markdown への注入を防ぐため、GitHub の命名規則に合う repo 名だけ通す
            | select(.repo.name | test("^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$"))
            | { date: .created_at[0:10], what: describe, repo: .repo.name, num: num,
                kind: (if (.type | startswith("PullRequest")) then "pull" else "issues" end) }
          ]
          | reduce .[] as $e ([];
              if length > 0 and (.[-1] | del(.kind)) == ($e | del(.kind)) then . else . + [$e] end)
          | .[:$limit]
          | if length == 0 then "_No public activity in the last \($days) days._"
            else map(
              "- `\(.date)` \(.what) [\(.repo)](https://github.com/\(.repo))"
              + (if .num then " [#\(.num)](https://github.com/\(.repo)/\(.kind)/\(.num))" else "" end)
            ) | join("\n")
            end
          JQ
          )"

          gh api "users/${OWNER}/events/public?per_page=100" \
            | jq -r --arg since "$since" --arg days "$ACTIVITY_DAYS" \
                 --argjson limit "$ACTIVITY_LIMIT" "$filter" \
            > profile/activity.md
          cat profile/activity.md

      - name: Stage artifact
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/out"
          mkdir -p "$out"
          cp profile-3d-contrib/profile-green.svg       "$out/contrib-3d-light.svg"
          cp profile-3d-contrib/profile-night-green.svg "$out/contrib-3d-dark.svg"
          ls -l "$out"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-assets
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 1

  # 書き込み権限はここだけ。動かすのは公式アクションと自前シェルのみ
  commit:
    name: Commit assets (write)
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # push に必要。v6 以降は資格情報が .git/config ではなく $RUNNER_TEMP の別ファイルに保存される
          persist-credentials: true

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: profile-assets
          path: ${{ runner.temp }}/assets

      # 生成ジョブが乗っ取られた場合に備え、決め打ちのファイル名・形式・サイズで検証する
      - name: Validate artifact
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/assets"
          expected=(contrib-3d-light.svg contrib-3d-dark.svg top-langs.svg activity.md)

          while IFS= read -r -d '' path; do
            name="${path#"$src"/}"
            case "$name" in
              contrib-3d-light.svg|contrib-3d-dark.svg|top-langs.svg|activity.md) ;;
              *) echo "::error::unexpected entry in artifact: $name"; exit 1 ;;
            esac
            if [[ -L "$path" || ! -f "$path" ]]; then
              echo "::error::not a regular file: $name"; exit 1
            fi
          done < <(find "$src" -mindepth 1 -print0)

          for e in "${expected[@]}"; do
            f="$src/$e"
            if [[ ! -f "$f" ]]; then echo "::error::missing $e"; exit 1; fi
            if (( $(stat -c %s "$f") >= 1048576 )); then echo "::error::$e is too large"; exit 1; fi
            if [[ "$e" == *.svg ]]; then
              if [[ "$(head -c 2048 "$f")" != *"<svg"* ]]; then echo "::error::$e is not an SVG"; exit 1; fi
              if grep -qiE '<script|javascript:' "$f"; then echo "::error::$e contains script"; exit 1; fi
            fi
          done

      - name: Update files
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/assets"
          mkdir -p profile
          cp "$src"/contrib-3d-light.svg "$src"/contrib-3d-dark.svg "$src"/top-langs.svg profile/

          start='<!-- ACTIVITY:START -->'
          end='<!-- ACTIVITY:END -->'
          if grep -qxF "$start" README.md && grep -qxF "$end" README.md; then
            awk -v start="$start" -v end="$end" -v frag="$src/activity.md" '
              $0 == start { print; while ((getline line < frag) > 0) print line; skipping = 1; next }
              $0 == end   { skipping = 0 }
              !skipping   { print }
            ' README.md > "$RUNNER_TEMP/README.md"
            mv "$RUNNER_TEMP/README.md" README.md
          else
            echo "::notice::ACTIVITY markers not found in README.md; skipping"
          fi

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile README.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore(profile): update metrics"
          git push
